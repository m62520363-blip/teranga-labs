# Configuration Supabase CLI — Teranga Labs
# Documentation : https://supabase.com/docs/reference/cli/config

project_id = "teranga-labs"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[db.pooler]
enabled = false
port = 54329
pool_mode = "transaction"
default_pool_size = 20
max_client_conn = 100

[realtime]
enabled = true

[studio]
enabled = true
port = 54323

[inbucket]
enabled = true
port = 54324

[storage]
enabled = true
file_size_limit = "50MiB"

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000/**"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = false

# Connexion par SMS (option complementaire de l'email, cf.
# components/phone-otp-form.tsx). Le SMS sert UNIQUEMENT a la connexion :
# aucun compte n'est cree depuis un numero seul (`shouldCreateUser: false`
# cote front), car handle_new_user() construit le profil de role a partir
# des metadata d'inscription.
#
# En local, aucun provider n'est configure : le bouton affiche alors un
# message d'indisponibilite et renvoie vers l'email. En production, renseigner
# le provider dans le dashboard Supabase (Auth > Providers > SMS), ou definir
# les variables ci-dessous.
[auth.phone]
enable = true
# `false` : aucun signup par telephone cote serveur. Un compte doit exister.
enable_signup = false
# Auto-verification impossible sans provider : on garde le code a saisir.
enable_confirmations = false

# Les tests pgtap de supabase/tests/*.sql sont exécutés par
# `supabase test db` (base locale) et par le job `db-tests` de
# .github/workflows/ci.yml. Voir scripts/db-test.mjs.
