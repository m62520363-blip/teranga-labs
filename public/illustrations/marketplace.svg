<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 360" fill="none" role="img" aria-label="Un client et un développeur échangent via un Token">
  <rect width="480" height="360" rx="24" fill="#080e20"/>
  <circle cx="240" cy="180" r="150" fill="#39ff88" opacity="0.07"/>
  <circle cx="240" cy="180" r="96" fill="#39ff88" opacity="0.06"/>
  <!-- Client -->
  <g>
    <rect x="52" y="120" width="120" height="150" rx="18" fill="#101833" stroke="#1e2a4e"/>
    <circle cx="112" cy="164" r="24" fill="#0f2e24"/>
    <circle cx="112" cy="156" r="10" fill="#39ff88"/>
    <path d="M92 186c4-12 12-18 20-18s16 6 20 18" fill="#39ff88"/>
    <rect x="74" y="214" width="76" height="8" rx="4" fill="#1e2a4e"/>
    <rect x="74" y="230" width="52" height="8" rx="4" fill="#1e2a4e"/>
    <text x="112" y="262" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" font-weight="600" fill="#f1f5ff">Client</text>
  </g>
  <!-- Développeur -->
  <g>
    <rect x="308" y="120" width="120" height="150" rx="18" fill="#101833" stroke="#1e2a4e"/>
    <circle cx="368" cy="164" r="24" fill="#0f2e24"/>
    <circle cx="368" cy="156" r="10" fill="#fbbf24"/>
    <path d="M348 186c4-12 12-18 20-18s16 6 20 18" fill="#fbbf24"/>
    <text x="352" y="226" font-family="ui-monospace,monospace" font-size="16" font-weight="700" fill="#39ff88">&lt;/&gt;</text>
    <rect x="330" y="240" width="76" height="8" rx="4" fill="#1e2a4e"/>
    <text x="368" y="262" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" font-weight="600" fill="#f1f5ff">Développeur</text>
  </g>
  <!-- Token au centre -->
  <g>
    <line x1="176" y1="196" x2="212" y2="196" stroke="#39ff88" stroke-width="3" stroke-dasharray="6 6" opacity="0.7"/>
    <line x1="268" y1="196" x2="304" y2="196" stroke="#39ff88" stroke-width="3" stroke-dasharray="6 6" opacity="0.7"/>
    <circle cx="240" cy="196" r="34" fill="#39ff88"/>
    <circle cx="240" cy="196" r="27" fill="none" stroke="#d5ffe8" stroke-width="3" opacity="0.85"/>
    <text x="240" y="205" text-anchor="middle" font-family="system-ui,sans-serif" font-size="24" font-weight="800" fill="#0b3b22">T</text>
  </g>
  <text x="240" y="322" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" font-weight="600" fill="#9aa7c7">1 Token débloque la conversation · 0 commission</text>
</svg>
